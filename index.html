<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="./stylesheets/style.css" rel="stylesheet" type="text/css" />
    <script src="javascripts/java-script.js" charset="utf-8"></script>
  </head>
  <body>
    <section class="block1" id="sblock1">
      <div class="text">
        <span class="top_text">Wings melody</span>
        <span class="top_text">Выбери своего наставника</span>
        <span class="top_text">Музыкальная лаборатория</span>
      </div>

      <div class="bird_container">
        <img
          src="./images/bird1.svg"
          alt="птица"
          class="bird_image"
          id="birdImage"
        />
      </div>

      <!-- кнопки -->
      <button class="icon_btn" id="leftArrow">
        <img src="./images/triangle_left.svg" alt="назад" class="btn_icon" />
      </button>

      <button class="icon_btn" id="rightArrow">
        <img src="./images/triangle_right.svg" alt="вперед" class="btn_icon" />
      </button>

      <button class="confirm_btn" id="confirmBtn">подтвердить выбор</button>

      <!-- <div class="vinyl_left">
        <img src="./images/disk.svg" alt="винил левый" />
      </div>
      <div class="vinyl_right">
        <img src="./images/disk.svg" alt="винил правый" />
      </div> -->
    </section>

    <section class="block2" id="block2">
      <!-- Окошко с правилами (появится после выбора птицы) -->
      <div class="rules_popup" id="rulesPopup">
        <div class="rules_content">
          <img
            src="./images/bird1mini.svg"
            alt="птичка"
            class="rules_bird"
            id="rulesBird"
          />
          <p class="rules_text" id="rulesText">
            Дорогуша, перед тобой сцена в клетку, а вокруг — ноты, музыкальные
            инструменты. Перетащи их внутрь так, чтобы заполнить все пустые
            клетки. Ни одной свободной, ни одного наложения. Как идеальный
            чемодан в тур. Справишься?
          </p>
          <button class="rules_close" id="closeRules">Понятно</button>
        </div>
      </div>
      <div class="game_container">
        <img
          src="./images/box.svg"
          alt="поле"
          class="for_tetris"
          id="tetrisBox"
        />

        <img src="./images/note_1.svg" alt="нота" class="note_1" id="note1" />
        <img src="./images/note_2.svg" alt="нота" class="note_2" id="note2" />
        <img
          src="./images/headphones.svg"
          alt="наушники"
          class="headphones"
          id="headphones"
        />
        <img
          src="./images/guitar.svg"
          alt="гитара"
          class="guitar"
          id="guitar"
        />
        <img
          src="./images/sticks.svg"
          alt="палочки"
          class="sticks"
          id="sticks"
        />
        <img
          src="./images/microphone.svg"
          alt="микрофон"
          class="microphone"
          id="microphone"
        />

        <img src="./images/vinyl.svg" alt="винил" class="vinyl" id="vinyl" />
      </div>
      <!-- анимация награды -->
      <div class="reward_vinyl" id="rewardVinyl">
        <img
          src="./images/vinyl_reward.svg"
          alt="виниловая пластинка награда"
        />
      </div>
    </section>
    <!-- ЭКРАН 3 -->
    <section class="block3">
      <div class="elips_1">
        <div class="elips_2">
          <div class="elips_3"></div>
        </div>
      </div>

      <div class="circle-group group-2">
        <div class="elips_1 small">
          <div class="elips_2 small">
            <div class="elips_3 small"></div>
          </div>
        </div>
      </div>

      <div class="circle-group group-3">
        <div class="elips_1 smaller">
          <div class="elips_2 smaller">
            <div class="elips_3 smaller"></div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
